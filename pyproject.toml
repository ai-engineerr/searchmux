[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchmux"
version = "0.1.0"
description = "The search layer for AI agents over SerpApi"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vikas Sharma" },
    { name = "Manisha Choudhary" },
]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
router = ["anthropic>=1.8"]
mcp = ["mcp>=2"]
dev = ["pytest>=8.0"]

[project.scripts]
searchmux-mcp = "searchmux.adapters.mcp_server:main"

[tool.setuptools.packages.find]
include = ["searchmux*"]

[tool.setuptools.package-data]
searchmux = ["catalog.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
