[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchmux"
version = "0.1.2"
description = "The search layer for AI agents over SerpApi"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vikas Sharma" },
    { name = "Manisha Choudhary" },
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rank-bm25>=0.2.2",
]

[project.urls]
Homepage = "https://github.com/ai-engineerr/searchmux"
Repository = "https://github.com/ai-engineerr/searchmux"
Issues = "https://github.com/ai-engineerr/searchmux/issues"
Changelog = "https://github.com/ai-engineerr/searchmux/blob/main/CHANGELOG.md"

[project.optional-dependencies]
router = ["anthropic>=1.8"]
mcp = ["mcp>=2"]
dev = ["pytest>=8.0"]

[project.scripts]
searchmux-mcp = "searchmux.adapters.mcp_server:main"

[tool.setuptools.packages.find]
include = ["searchmux*"]

[tool.setuptools.package-data]
searchmux = ["catalog.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade,
# B bugbear, SIM simplify. The 79-column limit is the house rule.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Eval arms must not abort the run on one bad case.
"evals/run_eval.py" = ["BLE001"]
