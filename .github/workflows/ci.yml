name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # The suite must pass with no SerpApi key. Cassettes make every
      # search path replayable offline; a test that needs the network
      # is a mis-written test, and this job is what proves it.
      - name: Run tests with no API key
        env:
          SERPAPI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: python -m pytest -q
